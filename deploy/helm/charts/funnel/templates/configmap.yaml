{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-funnel-conf
data:
  funnel.conf: |
    Server:
      HostName: "0.0.0.0"
      RPCPort: "9090"
      HTTPPort: "8000"
    Compute: {{ .Values.backend | default "local" }}
    {{- if eq (.Values.backend | default "local") "slurm" }}
    Slurm:
      Partition: {{ .Values.slurm.partition | default "short" | quote }}
      Timelimit: "4:00:00"
    {{- end }}
{{- end }}
